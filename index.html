<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mission Briefing</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:black;
}

.container{
  display:flex;
  width:100vw;
  height:100dvh;
  
  overflow-x:auto;
  overflow-y:hidden;

  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scroll-snap-stop: always;
}

.container::-webkit-scrollbar{
  display:none;
}

.slide{
  flex:0 0 100vw;

  width:100vw;
  height:100dvh;

  display:flex !important;
  justify-content: center !important;
  align-items: center !important;
  
  background:black;

  overflow:hidden;

  position:relative;

  scroll-snap-align: start; 
  scroll-snap-stop: always;

  place-items: center; 
}

video{
  max-width:100%;
  max-height:100%;

  width:auto;
  height:auto;

  object-fit:contain;

  display:block;

  margin: auto; 
}

.swipe-hint{
  position:absolute;
  top:62%; /* 💡 손가락 공간 확보를 위해 위로 살짝 올렸어 */

  left: 0;
  right: 0;
  margin: 0 auto; 
  
  width: max-content;
  
  color:white;

  font-size:18px; /* 💡 아이콘이랑 조화를 위해 폰트 크기 살짝 조절 */
  font-weight:bold;

  background:rgba(0,0,0,0.7);

  padding:14px 22px;

  border-radius:40px;

  opacity:0;
  transition:0.3s;

  /* 💡 글자와 손가락 아이콘을 세로로 정렬하기 위한 코드 */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;

  pointer-events:none;

  white-space:nowrap;

  z-index: 998; 
}

/* 💡 손가락 아이콘 스타일 및 좌우로 움직이는 애니메이션 설정 */
.swipe-icon {
  font-size: 28px;
  color: #ffffff;
  animation: swipeMove 1.5s ease-in-out infinite;
}

/* 💡 좌우로 슥슥 움직이는 모션 효과 */
@keyframes swipeMove {
  0% { transform: translateX(10px); }
  50% { transform: translateX(-10px); }
  100% { transform: translateX(10px); }
}
  
.pagination{
  position:fixed;

  top: 78%; /* 💡 손가락 때문에 도트도 아래로 살짝 내렸어 */
  left:50%;

  transform:translateX(-50%);

  display:flex;
  gap:10px;

  z-index:999; 
}

.dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:rgba(255,255,255,0.3);

  transition:0.3s;
}

.dot.active{
  background:white;

  transform:scale(1.35);

  box-shadow:0 0 10px rgba(255,255,255,0.9);
}
</style>
</head>

<body>
 
<div class="container">

  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_01_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      <span>SWIPE TO NEXT BRIEFING</span>
      <img src="finger.png" class="swipe-icon" style="width: 40px; height: auto;">
    </div>
  </section>

  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_02_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      <span>SWIPE TO NEXT BRIEFING</span>
      <img src="finger.png" class="swipe-icon" style="width: 40px; height: auto;">
    </div>
  </section>

  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_03_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      <span>SWIPE TO NEXT BRIEFING</span>
      <img src="finger.png" class="swipe-icon" style="width: 40px; height: auto;">
    </div>
  </section>

  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_04_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      <span>SWIPE TO NEXT BRIEFING</span>
      <img src="finger.png" class="swipe-icon" style="width: 40px; height: auto;">
    </div>
  </section>

  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_05_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      <span>END OF BRIEFING</span>
    </div>
  </section>

</div>

<div class="pagination">
  <span class="dot active"></span>
  <span class="dot"></span>
  <span class="dot"></span>
  <span class="dot"></span>
  <span class="dot"></span>
</div> 

<script>
const container = document.querySelector(".container");
const videos = document.querySelectorAll("video");
const dots = document.querySelectorAll(".dot");

videos.forEach(video => {
  const hint = video.parentElement.querySelector(".swipe-hint");

  video.addEventListener("ended", () => {
    hint.style.opacity = "1";
  });

  video.addEventListener("play", () => {
    hint.style.opacity = "0";
  });
});

function handleScroll() {
  const slideWidth = container.clientWidth;
  const currentIndex = Math.round(container.scrollLeft / slideWidth);

  dots.forEach((dot, index) => {
    if (index === currentIndex) {
      dot.classList.add("active");
    } else {
      dot.classList.remove("active");
    }
  });

  videos.forEach((video, index) => {
    if (index !== currentIndex) {
      if (!video.paused) video.pause();
      const hint = video.parentElement.querySelector(".swipe-hint");
      hint.style.opacity = "0";
    }
  });
}

container.addEventListener("scroll", handleScroll, { passive: true });
</script>

</body>
</html>
