<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mission Briefing</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:black;
}

.container{
  display:flex;
  width:100vw;
  height:100dvh;
  
  overflow-x:auto;
  overflow-y:hidden;

  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scroll-snap-stop: always;
}

.container::-webkit-scrollbar{
  display:none;
}

.slide{
  flex:0 0 100vw;

  width:100vw;
  height:100dvh;

  display:flex;
  justify-content:center;
  align-items:center;

  background:black;

  overflow:hidden;

  position:relative;

  /* 💡 여기에 스냅 정렬 기준(start)을 추가했어! */
  scroll-snap-align: start; 
  scroll-snap-stop: always;
}

video{
  max-width:100%;
  max-height:100%;

  width:auto;
  height:auto;

  object-fit:contain;

  display:block;
}

.swipe-hint{
  position:absolute;
  top:65%;

  left: 0;
  right: 0;
  margin: 0 auto; 
  
  width: max-content;
  
  color:white;

  font-size:20px;
  font-weight:bold;

  background:rgba(0,0,0,0.6);

  padding:14px 22px;

  border-radius:40px;

  opacity:0;
  transition:0.3s;

  text-align:center;

  pointer-events:none;

  white-space:nowrap;
}
  
.pagination{
  position:fixed;

  top: 76%;
  left:50%;

  transform:translateX(-50%);

  display:flex;
  gap:10px;

  z-index:999;
}

.dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:rgba(255,255,255,0.3);

  transition:0.3s;
}

.dot.active{
  background:white;

  transform:scale(1.35);

  box-shadow:0 0 10px rgba(255,255,255,0.9);
}
</style>
</head>

<body>
 
<div class="container">

  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_01_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      ← NEXT BRIEFING →
    </div>
  </section>

  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_02_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      ← NEXT BRIEFING →
    </div>
  </section>

  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_03_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      ← NEXT BRIEFING →
    </div>
  </section>

  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_04_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      ← NEXT BRIEFING →
    </div>
  </section>

  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_05_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      END OF BRIEFING
    </div>
  </section>

</div>

<div class="pagination">
  <span class="dot active"></span>
  <span class="dot"></span>
  <span class="dot"></span>
  <span class="dot"></span>
  <span class="dot"></span>
</div> 

<script>
const container = document.querySelector(".container");
const videos = document.querySelectorAll("video");
const dots = document.querySelectorAll(".dot");

// 1. 영상이 끝나면 힌트 보여주기
videos.forEach(video => {
  const hint = video.parentElement.querySelector(".swipe-hint");

  video.addEventListener("ended", () => {
    hint.style.opacity = "1";
  });

  video.addEventListener("play", () => {
    hint.style.opacity = "0";
  });
});

// 2. 스크롤할 때 도트 변경 + 지나간 영상 자동 일시정지 기능 추가!
function handleScroll() {
  const slideWidth = container.clientWidth;
  const currentIndex = Math.round(container.scrollLeft / slideWidth);

  // 도트(인디케이터) 업데이트
  dots.forEach((dot, index) => {
    if (index === currentIndex) {
      dot.classList.add("active");
    } else {
      dot.classList.remove("active");
    }
  });

  // 현재 안 보이는 슬라이드의 영상은 일시정지
  videos.forEach((video, index) => {
    if (index !== currentIndex && !video.paused) {
      video.pause();
    }
  });
}

// 스크롤 이벤트 연결
container.addEventListener("scroll", handleScroll, { passive: true });
</script>

</body>
</html>
