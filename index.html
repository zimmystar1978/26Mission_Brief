<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mission Briefing</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden; /* 💡 본문 자체가 절대 스크롤 안 생기게 원천 차단 */
  background: black;
}

.container{
  display: flex;
  width: 100%; /* 💡 100vw 대신 100%를 쓰면 스크롤바 때문에 화면 깨지는 걸 막아줘! */
  height: 100dvh;
  
  overflow-x: auto;
  overflow-y: hidden;

  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scroll-snap-stop: always;
}

.container::-webkit-scrollbar{
  display:none;
}

.slide{
  flex: 0 0 100%; /* 💡 이것도 100vw 대신 100%로 안전하게 매칭 */
  width: 100%;
  height: 100dvh;

  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
  
  background: black;
  overflow: hidden; /* 💡 슬라이드 박스 밖으로 나가는 건 전부 잘라버리기 */
  position: relative;
  scroll-snap-align: start; 
  scroll-snap-stop: always;
  isolation: isolate;
}

/* 💡 여기에 빠져있던 세미콜론(;)을 완벽하게 채워 넣었어! */
video{
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain; /* 💡 영상 비율을 유지하면서 화면 안에 쏙 들어가게 조절 */
  display: block;
  background: black;
}

.swipe-hint{
  position:absolute;
  top:62%; 

  left: 0;
  right: 0;
  margin: 0 auto; 
  
  width: max-content;
  
  color:white;

  font-size:18px; 
  font-weight:bold;

  background:rgba(0,0,0,0.7);

  padding:14px 22px;

  border-radius:40px;

  opacity:0;
  transition:0.3s;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;

  pointer-events:none;

  white-space:nowrap;

  z-index: 998; 
}

.swipe-icon {
  width: 40px; 
  height: auto;
  animation: swipeMove 1.5s ease-in-out infinite;
}

@keyframes swipeMove {
  0% { transform: translateX(10px); }
  50% { transform: translateX(-10px); }
  100% { transform: translateX(10px); }
}
  
.pagination{
  position:fixed;

  top: 78%; 
  left:50%;

  transform:translateX(-50%);

  display:flex;
  gap:10px;

  z-index:999; 
}

.dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:rgba(255,255,255,0.3);

  transition:0.3s;
}

.dot.active{
  background:white;

  transform:scale(1.35);

  box-shadow:0 0 10px rgba(255,255,255,0.9);
}
</style>
</head>

<body>
 
<div class="container">

  <section class="slide">
    <video controls playsinline preload="metadata" autoplay muted>
      <source src="Mission_Brief_01_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      <span>SWIPE TO NEXT BRIEFING</span>
      <img src="finger.png" class="swipe-icon">
    </div>
  </section>

  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_02_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      <span>SWIPE TO NEXT BRIEFING</span>
      <img src="finger.png" class="swipe-icon">
    </div>
  </section>

  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_03_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      <span>SWIPE TO NEXT BRIEFING</span>
      <img src="finger.png" class="swipe-icon">
    </div>
  </section>

  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_04_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      <span>SWIPE TO NEXT BRIEFING</span>
      <img src="finger.png" class="swipe-icon">
    </div>
  </section>

  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_05_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      <span>END OF BRIEFING</span>
    </div>
  </section>

</div>

<div class="pagination">
  <span class="dot active"></span>
  <span class="dot"></span>
  <span class="dot"></span>
  <span class="dot"></span>
  <span class="dot"></span>
</div> 

<script>
const container = document.querySelector(".container");
const videos = document.querySelectorAll("video");
const dots = document.querySelectorAll(".dot");

// 💡 스크롤이 완전히 끝났을 때(정확히 슬라이드 안착) 감지하기 위한 타이머 변수
let scrollTimeout;

videos.forEach(video => {
  const hint = video.parentElement.querySelector(".swipe-hint");

  video.addEventListener("ended", () => {
    hint.style.opacity = "1";
  });

  video.addEventListener("play", () => {
    hint.style.opacity = "0";
  });
});

function handleScroll() {
  const slideWidth = container.clientWidth;
  const currentIndex = Math.round(container.scrollLeft / slideWidth);

  // 1. 도트 업데이트
  dots.forEach((dot, index) => {
    if (index === currentIndex) {
      dot.classList.add("active");
    } else {
      dot.classList.remove("active");
    }
  });

  // 2. 다른 슬라이드의 비디오 일시정지 및 힌트 초기화
  videos.forEach((video, index) => {
    if (index !== currentIndex) {
      if (!video.paused) video.pause();
      const hint = video.parentElement.querySelector(".swipe-hint");
      hint.style.opacity = "0";
    }
  });

  // 3. 디바운싱 기법을 이용해 스크롤이 '완전히 멈춘 후' 현재 비디오를 자동 재생
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    const currentVideo = videos[currentIndex];
    
    // 현재 비디오가 일시정지 상태라면 재생 시도
    if (currentVideo && currentVideo.paused) {
      // 모바일 브라우저의 play() 에러 거부 정책 방어 코드 추가
      currentVideo.play().catch(error => {
        console.log("자동 재생이 차단되었습니다. 유저의 터치가 필요합니다:", error);
      });
    }
  }, 150); // 0.15초 동안 스크롤 이동이 없으면 멈춘 것으로 판단
}

container.addEventListener("scroll", handleScroll, { passive: true });
</script>

</body>
</html>
