<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mission Briefing</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:black;
}

.container{
  display:flex;
  width:100vh;
  height:100dvh;
  
  overflow-x:auto;
  overflow-y:hidden;

  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;

}

.container::-webkit-scrollbar{
  display:none;
}

.slide{
  flex:0 0 100vw;

  width:100vw;
  height:100dvh;

  display:flex;
  justify-content:center;
  align-items:center;

  background:black;

  overflow:hidden;

  position:relative;
}

video{
  max-width:100%;
  max-height:100%;

  width:auto;
  height:auto;

  object-fit:contain;

  display:block;
}

.swipe-hint{
  position:absolute;
  top:65%;

  left: 0;
  right: 0;
  margin: 0 auto; 
  
  width: max-content;
  
  color:white;

  font-size:20px;
  font-weight:bold;

  background:rgba(0,0,0,0.6);

  padding:14px 22px;

  border-radius:40px;

  opacity:0;
  transition:0.3s;

  text-align:center;

  pointer-events:none;

  white-space:nowrap;
}

</style>
</head>

<body>

<div class="container">

  <!-- Briefing card 1 -->
  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_01_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      ← NEXT BRIEFING →
    </div>
  </section>

  <!-- Briefing card 2 -->
  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_02_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      ← NEXT BRIEFING →
    </div>
  </section>

  <!-- Briefing card 3 -->
  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_03_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      ← NEXT BRIEFING →
    </div>
  </section>

  <!-- Briefing card 4 -->
  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_04_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      ← NEXT BRIEFING →
    </div>
  </section>

  <!-- Briefing card 5 -->
  <section class="slide">
    <video controls playsinline preload="metadata">
      <source src="Mission_Brief_05_0526.mp4" type="video/mp4">
    </video>

    <div class="swipe-hint">
      END OF BRIEFING
    </div>
  </section>

</div>

<script>

const videos = document.querySelectorAll("video");

videos.forEach(video => {

  const hint =
    video.parentElement.querySelector(".swipe-hint");

  video.addEventListener("ended", () => {
    hint.style.opacity = "1";
  });

  video.addEventListener("play", () => {
    hint.style.opacity = "0";
  });

});

</script>

</body>
</html>
